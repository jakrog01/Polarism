name: Release

# Every merge into master is a release. The version is taken from
# pyproject.toml and must be bumped (and match polarism.__version__);
# a version that is already tagged fails the pull request and the release.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only dev may be merged into master
        if: github.event_name == 'pull_request' && github.head_ref != 'dev'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "::error::Pull requests into master must come from 'dev', got '$HEAD_REF'."
          exit 1

      - name: Read and check release version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init_version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' polarism/__init__.py)
          if [ "$version" != "$init_version" ]; then
            echo "::error::pyproject.toml version ($version) differs from polarism.__version__ ($init_version)."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists. Bump the version in pyproject.toml and polarism/__init__.py."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tests:
    needs: version
    uses: ./.github/workflows/tests.yml

  release:
    if: github.event_name == 'push'
    needs: [version, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Polarism $VERSION" \
            --generate-notes

  docs:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
