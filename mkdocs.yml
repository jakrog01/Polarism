site_name: Polarism
site_description: High-performance documentation for the Polarism Gross-Pitaevskii solver
site_url: https://jakrog01.github.io/Polarism/
repo_url: https://github.com/jakrog01/Polarism
repo_name: jakrog01/Polarism
edit_uri: edit/dev/docs/
copyright: Copyright &copy; 2026 Jakub Rogala
docs_dir: docs
strict: true

exclude_docs: |
  plans/

nav:
  - Home:
      - Polarism: index.md
      - About: about.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User guide:
      - Configuring a run: user-guide/configuration.md
      - Grid and physics: user-guide/grid-and-physics.md
      - Pumps and reservoirs: user-guide/pumps-and-reservoirs.md
      - Potentials and boundaries: user-guide/potentials-and-boundaries.md
      - Profiles and envelopes: user-guide/profiles-and-envelopes.md
      - Coherent drive: user-guide/coherent-drive.md
      - Spin and polarization: user-guide/spin-and-polarization.md
      - Initial conditions and noise: user-guide/initial-conditions-and-noise.md
      - Solvers and time stepping: user-guide/solvers-and-time-stepping.md
      - Output and results: user-guide/output-and-results.md
      - Observables and spectra: user-guide/observables-and-spectra.md
      - Parameter sweeps: user-guide/parameter-sweeps.md
      - Checkpoint and restart: user-guide/checkpoint-and-restart.md
      - Running on GPUs: user-guide/running-on-gpus.md
  - Plugins:
      - Overview: plugins/index.md
      - Your first plugin: plugins/first-plugin.md
      - Lasers: plugins/lasers.md
      - Potentials: plugins/potentials.md
      - Initial conditions: plugins/initial-conditions.md
      - Profiles and envelopes: plugins/profiles.md
      - Reservoirs: plugins/reservoirs.md
      - Terms: plugins/terms.md
      - Dispersion: plugins/dispersion.md
      - Solvers: plugins/solvers.md
      - Grids: plugins/grids.md
      - Absorption: plugins/absorption.md
      - Storage formats: plugins/storage.md
      - Observables: plugins/observables.md
  - Reference:
      - Configuration: reference/configuration.md
      - Solvers: reference/solvers.md
      - Results format: reference/results-format.md
      - Python API: reference/python-api.md
  - Explanation:
      - Physics: explanation/physics.md
  - Development:
      - Contributing: development/contributing.md
      - Testing and CI: development/testing-and-ci.md
      - GPU profiling: development/profiling.md
      - Release notes: https://github.com/jakrog01/Polarism/releases

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.path
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            members_order: source
            docstring_style: google
            filters: ["!^_"]

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
