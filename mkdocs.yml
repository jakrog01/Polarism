site_name: Polarism
site_description: High-performance documentation for the Polarism Gross-Pitaevskii solver
site_url: https://jakrog01.github.io/Polarism/
repo_url: https://github.com/jakrog01/Polarism
repo_name: jakrog01/Polarism
edit_uri: edit/dev/docs/
copyright: Copyright &copy; 2026 Jakub Rogala
docs_dir: docs
strict: true

exclude_docs: |
  plans/

nav:
  - Home:
      - Polarism: index.md
      - About: about.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User Guide:
      - Running on GPUs: user-guide/running-on-gpus.md
      - Grid and Parameters: user-guide/grid-and-parameters.md
      - Potentials and Pumps: user-guide/potentials-and-pumps.md
      - Time Evolution: user-guide/time-evolution.md
      - Output and Visualization: user-guide/output-and-visualization.md
      - Checkpoint and Restart: user-guide/checkpoint-and-restart.md
      - Parameter Sweeps: user-guide/parameter-sweeps.md
      - Plugins:
          - Overview: plugins/index.md
          - Your first plugin: plugins/first-plugin.md
          - Lasers: plugins/lasers.md
          - Potentials: plugins/potentials.md
          - Reservoirs: plugins/reservoirs.md
          - Solvers: plugins/solvers.md
          - Grids: plugins/grids.md
          - Absorption strategies: plugins/absorption.md
          - Storage formats: plugins/storage.md
          - Observables: plugins/observables.md
  - Reference:
      - Overview: api/overview.md
      - Option Matrix: api/option-matrix.md
      - Top-Level Package: api/polarism.md
      - Configuration: api/configuration.md
      - Controller and Backend: api/controller-and-backend.md
      - Model Components: api/model-components.md
      - Solvers: api/solvers.md
      - Results: api/results.md
      - Python API: api/python-api.md
  - Explanation:
      - Physics Background: development/physics-background.md
  - Development:
      - GPU Profiling: development/profiling.md
      - Testing and CI: development/testing-and-ci.md
      - Contributing: development/contributing.md
      - Migrating to 0.4: development/migrating-to-0.4.md
      - Release notes: https://github.com/jakrog01/Polarism/releases

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.path
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            members_order: source
            docstring_style: google
            filters: ["!^_"]

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
