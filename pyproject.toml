[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "polarism"
version = "0.3.2"
description = "High-performance tools for driven-dissipative exciton-polariton simulations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jakub Rogala" }]
keywords = [
    "exciton-polariton",
    "gross-pitaevskii",
    "driven-dissipative",
    "physics-simulation",
    "cuda",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "h5py>=3.15",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "PyYAML>=6.0",
    "tqdm>=4.67",
    "tyro>=0.9",
]

[project.optional-dependencies]
cuda12 = [
    "cupy-cuda12x>=13",
]
cuda13 = [
    "cupy-cuda13x>=14",
]
docs = [
    "mkdocs-material>=9.7",
]
test = [
    "pytest>=8.3",
]
dev = [
    "mkdocs-material>=9.7",
    "pytest>=8.3",
]

[project.urls]
Homepage = "https://github.com/jakrog01/Polarism"
Repository = "https://github.com/jakrog01/Polarism"
Documentation = "https://jakrog01.github.io/Polarism/"
Issues = "https://github.com/jakrog01/Polarism/issues"
Changelog = "https://github.com/jakrog01/Polarism/releases"

[project.scripts]
polarism = "polarism.cli:main"
polarism-bench = "polarism.benchmark:main"

[tool.setuptools.packages.find]
include = ["polarism*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "compliance: marks solver compliance tests (run with '-m compliance')",
    "gpu: requires an available CUDA device (deselected in default run)",
]
addopts = "-m 'not slow and not compliance'"
