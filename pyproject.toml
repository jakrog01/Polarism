[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "polarism"
version = "0.3.0"
description = "High-performance tools for driven-dissipative exciton-polariton simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.15",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.7",
    "scipy>=1.14",
    "tqdm>=4.67",
    "tyro>=0.9",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.7",
]
test = [
    "pytest>=8.3",
]
dev = [
    "mkdocs-material>=9.7",
    "pytest>=8.3",
]

[project.scripts]
polarism = "polarism.cli:main"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["polarism*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "compliance: marks solver compliance tests (run with '-m compliance')",
    "gpu: requires an available CUDA device (deselected in default run)",
]
addopts = "-m 'not slow and not compliance'"
