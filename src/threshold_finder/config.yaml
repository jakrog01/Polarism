global:
  grid:
    nx: 256
    ny: 256
    lx: 250.0
    ly: 250.0
    grid_type: periodic

  physics:
    hbar: 0.6582119514
    m_eff: 0.284
    gamma_R: 0.005
    gamma_C: 0.083
    g_C: 0.001
    g_R: 0.002
    gamma_I: 0.001
    gamma_A: 0.005
    R: 0.02
    R_IA: 0.05
    R_AI: 0.0025
    init_eps: 0.001

  boundary_condition:
    absorption: cap

  potential:
    potential_type: zero

  reservoir:
    reservoir_type: double

  solver:
    total_time: 750.0
    dt: 0.001
    method: rk4-cuda

laser:
  laser_type: pulse-gaussian
  x0: 0.0
  y0: 0.0
  sigma_space: 5.0
  sigma_time: 1.0
  pulse_separation: 10.0
  cutoff_sigma: 3.0
  n_pulses: 0

sweep:
  P_min: 0.5
  P_max: 10.0
  P_step: 0.5
  scalar_check_every: 50
  early_stop_on_divergence: true
  max_concurrent: 4

output:
  save_per_power_trace: true
  save_final_state: false
