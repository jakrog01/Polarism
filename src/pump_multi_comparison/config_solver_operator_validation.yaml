global:
  grid:
    nx: 512
    ny: 512
    lx: 128.0
    ly: 128.0
    grid_type: periodic

  physics:
    hbar: 0.6582119514
    m_eff: 0.284
    gamma_R: 0.005
    gamma_C: 0.083
    g_C: 0.001
    g_R: 0.002
    gamma_I: 0.001
    R: 0.02
    kappa: 0.05
    init_eps: 0.001

  boundary_condition:
    absorption: cap

  solver:
    total_time: 400.0
    dt: 0.001
    method: rk4-cuda

  reservoir:
    reservoir_type: quadratic-double

  laser_defaults:
    laser_type: pulse-gaussian
    sigma_space: 0.75
    cutoff_sigma: 3.0

  parameter_sweep:
    enabled: true
    power_values:
      - 50.0
    sigma_time_values:
      - 0.85
    pulse_separation_values:
      - 100.0
    sigma_space_values:
      - 0.75

output:
  render_animation: false
  render_snapshots: true
  archive_raw_hdf5: false
  field_record_stride: 2000
  scalar_record_stride: 10
  roi_metrics:
    enabled: true
    rois:
      - id: center
        shape: circle
        x0: 0.0
        y0: 0.0
        radius: "D / 2"

_timing_vars_single: &timing_vars_single
  pulse_duration: "2 * cutoff_sigma * sigma_time"
  cycle_duration: "pulse_separation"

_single_center_laser: &single_center_laser
  - id: "center"
    power: "P"
    x0: 0.0
    y0: 0.0
    delay: 0.0
    pulse_separation: "cycle_duration"
    n_pulses: 0

scenarios:
  - name: fdm_512_periodic
    grid:
      nx: 512
      ny: 512
      grid_type: periodic
    solver:
      method: rk4-cuda
    potential:
      potential_type: zero
    timing_vars: *timing_vars_single
    lasers: *single_center_laser

  - name: fft_512_periodic
    grid:
      nx: 512
      ny: 512
      grid_type: periodic
    solver:
      method: split-step-fft
    potential:
      potential_type: zero
    timing_vars: *timing_vars_single
    lasers: *single_center_laser

  - name: fdm_1024_periodic
    grid:
      nx: 1024
      ny: 1024
      grid_type: periodic
    solver:
      method: rk4-cuda
    potential:
      potential_type: zero
    timing_vars: *timing_vars_single
    lasers: *single_center_laser
