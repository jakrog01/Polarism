global:
  grid:
    nx: 512
    ny: 512
    lx: 64.0
    ly: 64.0
    grid_type: closed-interval

  physics:
    hbar: 0.6582119514
    m_eff: 0.284
    gamma_R: 0.005
    gamma_C: 0.083
    g_C: 0.001
    g_R: 0.002
    gamma_I: 0.001
    kappa: 0.05
    R: 0.02
    init_eps: 0.001
    init_mode: filtered_complex_gaussian
    init_k_cutoff_um: 3.0
    init_seed: 42

  boundary_condition:
    absorption: cap

  solver:
    total_time: 400.0
    dt: 0.001
    method: rk4-cuda
    laplacian: five-point

  reservoir:
    reservoir_type: quadratic-double

  laser_defaults:
    laser_type: pulse-gaussian
    sigma_space: 1.0
    cutoff_sigma: 3.0
    power_definition: pulse_energy

  threshold_search:
    max_runtime_minutes: 60
    condensation_fraction: 0.7
    dt_multiplier: 5
    n_pulses: 0
    power_values:
      - 50.0
    sigma_time_values:
      - 0.85
    pulse_separation_formula: "100.0"

  parameter_sweep:
    enabled: true
    power_values:
      - 20.0
      - 25.0
      - 30.0
      - 40.0
      - 50.0
    sigma_time_values:
      - 0.85
    pulse_separation_values:
      - 100.0
    sigma_space_values:
      - 1.25
      - 2.0

output:
  render_animation: false
  render_snapshots: true
  archive_raw_hdf5: false
  field_record_stride: 2000
  scalar_record_stride: 50
  roi_metrics:
    enabled: true
    rois:
      - id: center
        shape: circle
        x0: 0.0
        y0: 0.0
        radius: "D / 2"

_timing_vars_single: &timing_vars_single
  pulse_duration: "2 * cutoff_sigma * sigma_time"
  cycle_duration: "pulse_separation"

_single_center_laser: &single_center_laser
  - id: "center"
    power: "P"
    x0: 0.0
    y0: 0.0
    delay: 0.0
    pulse_separation: "cycle_duration"
    n_pulses: 0

scenarios:
  - name: qdouble_eta0_nodiff
    reservoir:
      reservoir_type: quadratic-double
    physics:
      kinetic_relaxation_eta: 0.0
      reservoir_diffusion_I: 0.0
      reservoir_diffusion_R: 0.0
    potential:
      potential_type: zero
    timing_vars: *timing_vars_single
    lasers: *single_center_laser

  - name: qdouble_eta1e-5_nodiff
    reservoir:
      reservoir_type: quadratic-double
    physics:
      kinetic_relaxation_eta: 1.0e-5
      reservoir_diffusion_I: 0.0
      reservoir_diffusion_R: 0.0
    potential:
      potential_type: zero
    timing_vars: *timing_vars_single
    lasers: *single_center_laser

  - name: qdouble_eta3e-5_nodiff
    reservoir:
      reservoir_type: quadratic-double
    physics:
      kinetic_relaxation_eta: 3.0e-5
      reservoir_diffusion_I: 0.0
      reservoir_diffusion_R: 0.0
    potential:
      potential_type: zero
    timing_vars: *timing_vars_single
    lasers: *single_center_laser

  - name: qdouble_eta1e-4_nodiff
    reservoir:
      reservoir_type: quadratic-double
    physics:
      kinetic_relaxation_eta: 1.0e-4
      reservoir_diffusion_I: 0.0
      reservoir_diffusion_R: 0.0
    potential:
      potential_type: zero
    timing_vars: *timing_vars_single
    lasers: *single_center_laser

  - name: qdouble_eta1e-5_diff
    reservoir:
      reservoir_type: quadratic-double
    physics:
      kinetic_relaxation_eta: 1.0e-5
      reservoir_diffusion_I: 1.0e-5
      reservoir_diffusion_R: 1.0e-3
    potential:
      potential_type: zero
    timing_vars: *timing_vars_single
    lasers: *single_center_laser
