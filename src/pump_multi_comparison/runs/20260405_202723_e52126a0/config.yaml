global:
  grid:
    nx: 256
    ny: 256
    lx: 250.0
    ly: 250.0
    grid_type: periodic

  physics:
    hbar: 0.6582119514
    m_eff: 0.284
    gamma_R: 0.005
    gamma_C: 0.083
    g_C: 0.001
    g_R: 0.002
    gamma_I: 0.001
    gamma_A: 0.005
    R: 0.02
    R_IA: 0.05
    R_AI: 0.0025
    init_eps: 0.001

  boundary_condition:
    absorption: cap

  solver:
    total_time: 750.0
    dt: 0.001
    method: rk4-cuda

  reservoir:
    reservoir_type: double

  laser_defaults:
    laser_type: pulse-gaussian
    sigma_space: 5.0
    cutoff_sigma: 3.0

  threshold_search:
    max_runtime_minutes: 30
    condensation_fraction: 0.7
    dt_multiplier: 5
    power_values:
      - 5.0
      - 10.0
      - 20.0
      - 40.0
      - 60.0
      - 80.0
    sigma_time_values:
      - 0.25
      - 0.5
      - 1.0
      - 2.0
      - 4.0
    pulse_separation_values:
      - 2.0
      - 5.0
      - 10.0
      - 20.0
      - 40.0
      - 60.0
      - 80.0
_timing_vars_seq: &timing_vars_seq
  pulse_duration: "2 * cutoff_sigma * sigma_time"
  cycle_duration: "4 * pulse_duration"
  center_wait_cycles: 5.0
_lasers_seq_5spot: &lasers_seq_5spot
  - id: "s0"
    tags: ["outer"]
    x0: 30.0
    y0: 0.0
    delay: 0.0
    pulse_separation: "cycle_duration"

  - id: "s1"
    tags: ["outer"]
    x0: 0.0
    y0: 30.0
    delay: "pulse_duration"
    pulse_separation: "cycle_duration"

  - id: "s2"
    tags: ["outer"]
    x0: -30.0
    y0: 0.0
    delay: "2 * pulse_duration"
    pulse_separation: "cycle_duration"

  - id: "s3"
    tags: ["outer"]
    x0: 0.0
    y0: -30.0
    delay: "3 * pulse_duration"
    pulse_separation: "cycle_duration"

  - id: "center"
    power: "1.0P"
    x0: 0.0
    y0: 0.0
    delay: "center_wait_cycles * cycle_duration"
    pulse_separation: 1000.0
scenarios:
  - name: seq_5spot_p0.1
    potential:
      potential_type: zero
    timing_vars: *timing_vars_seq
    power_modifiers:
      - ids: ["s0", "s1", "s2", "s3"]
        power: "0.1P"
    lasers: *lasers_seq_5spot

  - name: seq_5spot_p0.2
    potential:
      potential_type: zero
    timing_vars: *timing_vars_seq
    power_modifiers:
