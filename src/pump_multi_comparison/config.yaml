  - name: seq_5spot_r20
    potential:
      potential_type: zero
    timing_vars: *timing_vars_seq
    power_modifiers:
      - ids: ["s0", "s1", "s2", "s3"]
        power: "1.2P"
    lasers: *lasers_seq_r20

