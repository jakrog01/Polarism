architecture:
  kind: ballistic_correlator
  roi_radius_um: 3.0
  geometry:
    input_radius_um: 28.0
    input_angles_deg: [180, 300, 60]
  pump:
    sigma_space_um: 1.2
    sigma_time_ps: 1.5
    cutoff_sigma: 3.0
    power_definition: pulse_energy
    input_energy_values: [1800.0, 2600.0]
  mixer_gate:
    enabled: true
    x0: 0.0
    y0: 0.0
    delay_ps: 18.0
    sigma_space_um: 1.2
    sigma_time_ps: 1.5
    cutoff_sigma: 3.0
    energy_values: [0.0, 1600.0]
  output_rois:
    radius_um: 42.0
    angles_deg: [0, 45, 90, 135, 180, 225, 270, 315]
  patterns:
    - name: single_left
      description: one incoming packet from left
      active_inputs: [0]
    - name: pair_sync_bottom
      description: two synchronous packets should meet off center
      active_inputs: [0, 1]
    - name: pair_sync_top
      description: alternate pair tests geometry symmetry
      active_inputs: [0, 2]
    - name: pair_delayed
      description: same pair as bottom but input 1 arrives late
      active_inputs: [0, 1]
      delays_ps:
        1: 16.0
    - name: all_three_sync
      description: three-way coincidence control
      active_inputs: [0, 1, 2]

global:
  physics:
    hbar: 0.6582119514
    m_eff: 0.32
    gamma_C: 0.1
    gamma_R: 0.15
    gamma_I: 0.001
    g_C: 0.00024
    g_R: 0.0006
    g_I: 0.0
    R: 0.023
    kappa: 0.05
    kinetic_relaxation_eta: 1.0e-5
    init_mode: filtered_complex_gaussian
    init_k_cutoff_um: 3.0
    init_seed: 42
    init_eps: 1.0e-3
  grid:
    nx: 1024
    ny: 1024
    lx: 160.0
    ly: 160.0
    grid_type: periodic
  boundary_condition:
    absorption: cap
    profile_type: sin2
    strength: 5.0
    mask_width_percent: 0.2
  reservoir:
    reservoir_type: quadratic-double
  solver:
    method: rk4-cuda
    laplacian: isotropic-9pt
    dt: 0.01
    total_time: 150.0

output:
  scalar_stride_steps: 100
  save_final_downsampled_fields: true
  field_downsample: 8
