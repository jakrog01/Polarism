polarism_config_path: "polarism_base.yaml"
data:
  path: "~/mnist/mnist.npz"
  n_samples: 1000
  seed: 0
geometry:
  center_x_um: 0.0
  center_y_um: 0.0
  pitch_um: 12.0
  sigma_space_um: 2.0
pulse:
  sigma_time: 1.5
  pulse_separation: 10.0
  n_pulses: 10
  cutoff_sigma: 3.0
  power_definition: pulse_energy
encoding:
  power_min: 0.0
  power_max: 800.0
readout:
  warmup_ps: 0.0
  stride_steps: 10
  mask_radius_um: 3.0
  record_reservoir: true
  feature_mode: summary
  batch_size: 32
classifier:
  test_fraction: 0.20
  C: 1.0
  max_iter: 2000
output_dir: "simulation_results/snn_dynamic/run_0001"
