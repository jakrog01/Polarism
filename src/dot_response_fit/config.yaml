global:
  grid:
    nx: 256
    ny: 256
    lx: 250.0
    ly: 250.0
    grid_type: periodic

  physics:
    hbar: 0.6582119514
    m_eff: 0.284
    gamma_R: 0.005
    gamma_C: 0.0833
    gamma_I: 0.001
    gamma_A: 0.005
    R: 0.0006
    kappa: 0.05
    g_C: 0.001
    g_R: 0.002
    init_eps: 0.001

  boundary_condition:
    absorption: cap

  reservoir:
    reservoir_type: quadratic-double

  solver:
    total_time: 2500.0
    dt: 0.001
    method: rk4-cuda

  laser_defaults:
    laser_type: pulse-gaussian
    cutoff_sigma: 3.0
    x0: 0.0
    y0: 0.0

mnist:
  data_path: ~/data/mnist.npz
  digit_class: null
  sample_index: null
  sample_indices: null
  n_images: 10
  seed: 42
  max_pixels: 50
  spatial_width_um: 80.0

encoding:
  min_amp: 10.0
  max_amp: 32.3
  pulse_width_fwhm: 5.0
  separation: 43.0

reference:
  n_points: 2000
  ode_solver_rtol: 1.0e-6
  ode_solver_atol: 1.0e-7
  nc_source: 1.0e-6

fit:
  sigma_space_values: [1.0, 2.0, 3.0, 5.0, 8.0, 12.0, 16.0]
  observable: psi_sq_max
  aggregate: mean_rmse
  max_runtime_minutes: 120
  dt_factor: 5
  n_fit_pixels: null
  scalar_stride: 50
  n_ref_points: 2000

output:
  render_snapshots: true
  render_animation: true
  archive_raw_hdf5: false
  field_record_stride: 100
  scalar_record_stride: 10
  render_mnist_overlay: true

scenarios:
  - name: mnist_dot
    potential:
      potential_type: zero
