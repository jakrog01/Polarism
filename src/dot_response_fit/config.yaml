global:
  grid:
    nx: 256
    ny: 256
    lx: 250.0
    ly: 250.0
    grid_type: periodic

  physics:
    hbar: 0.6582119514
    m_eff: 0.284
    gamma_R: 0.005
    gamma_C: 0.0833
    gamma_I: 0.001
    gamma_A: 0.005
    R: 0.0006
    kappa: 0.05
    g_C: 0.001
    g_R: 0.002
    init_eps: 0.001

  boundary_condition:
    absorption: cap

  reservoir:
    reservoir_type: quadratic-double

  solver:
    total_time: 400.0
    dt: 0.001
    method: rk4-cuda

  laser_defaults:
    laser_type: pulse-gaussian
    cutoff_sigma: 3.0
    sigma_time: 0.1
    pulse_separation: 1.6

time_response:
  t_start: 0.0
  t_end: 400.0
  n_points: 1000
  amplitudes:
    start: 0.0
    end: 160.0
    count: 60
  pulse:
    center: 20.0
    width_fwhm: 5.0

fit:
  sigma_space_values: [1.0, 2.0, 3.0, 5.0, 8.0, 12.0, 16.0]
  amplitude_scale_values: [1.0]
  observable: psi_sq_max
  max_runtime_minutes: 120
  record_stride: 100

scenarios:
  - name: fitted_single_dot
    potential:
      potential_type: zero
    lasers:
      - id: dot
        x0: 0.0
        y0: 0.0
        P0: 80.0
        n_pulses: 5
