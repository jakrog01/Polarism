mnist:
  data_path: ~/data/mnist.npz
  n_train: 100
  n_test: 100
  seed: 42

projection:
  method: pca
  n_components: 16

encoding:
  T_max: 100.0
  ring_radius_um: 20.0
  ring_rotation_rad: 0.19634954085
  sigma_space_um: 0.85
  sigma_time_ps: 1.5
  sigma_time_ring_ps: 1.5
  sigma_time_trigger_ps: 0.1
  cutoff_sigma: 3.0
  power_definition: pulse_energy

calibration:
  P_ring_threshold: null
  P_trigger_threshold: null
  P_ring_subthreshold_fraction: 0.8
  P_trigger_fraction: P_TRIGGER_FRACTION_PLACEHOLDER

global:
  physics:
    hbar: 0.6582119514
    m_eff: 0.32
    gamma_C: 0.1
    gamma_R: 0.15
    gamma_I: 0.001
    g_C: 0.00024
    g_R: 0.0006
    g_I: 0.0
    R: 0.023
    kappa: 0.05
    kinetic_relaxation_eta: 1.0e-5
    init_mode: filtered_complex_gaussian
    init_k_cutoff_um: 3.0
    init_seed: 42
    init_eps: 1.0e-3
  grid:
    nx: 1024
    ny: 1024
    lx: 160.0
    ly: 160.0
    grid_type: periodic
  boundary_condition:
    absorption: cap
    profile_type: sin2
    strength: 5.0
    mask_width_percent: 0.2
  reservoir:
    reservoir_type: quadratic-double
  solver:
    method: rk4-cuda
    laplacian: isotropic-9pt
    dt: 0.01
    total_time: 200.0

readout:
  window_start_offset_ps: 5.0
  window_end_offset_ps: 35.0
  stride_steps: 100
  calibration_stride_steps: 500
  kspace_crop_size: 64
  normalization: log_total_power
  pca_components: 128
  central_roi_um: 6.0

slurm:
  batch_size: 25
  max_concurrent_tasks: 32
  gpu_memory_gb: 16
  time_limit: "04:00:00"
  partition: gpu
