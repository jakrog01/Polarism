global:
  grid:
    nx: 1024
    ny: 1024
    lx: 160.0
    ly: 160.0
    grid_type: periodic

  physics:
    hbar: 0.6582119514
    m_eff: 0.32
    gamma_C: 0.1
    gamma_R: 0.15
    gamma_I: 0.001
    g_C: 0.00024
    g_R: 0.0006
    g_I: 0.0
    R: 0.023
    kappa: 0.05
    init_eps: 0.001
    init_mode: filtered_complex_gaussian
    init_k_cutoff_um: 3.0
    init_seed: 42
    kinetic_relaxation_eta: 0.0
    reservoir_diffusion_I: 0.0
    reservoir_diffusion_R: 0.0

  boundary_condition:
    absorption: cap
    profile_type: sin2
    strength: 5.0
    mask_width_percent: 0.2

  reservoir:
    reservoir_type: quadratic-double

  solver:
    total_time: 200.0
    dt: 0.01
    method: ifrk4-fft-cuda
    laplacian: five-point

  laser_defaults:
    laser_type: pulse-gaussian
    sigma_space: 2.0
    sigma_time: 1.5
    cutoff_sigma: 3.0
    power_definition: pulse_energy

  parameter_sweep:
    enabled: true
    base_scenarios: [square4]
    power_values: [1600.0, 2000.0, 2400.0]
    square_side_values: [8.0, 8.8, 9.6, 10.4, 11.2, 12.0, 12.8, 13.6, 14.4, 15.2,
                         16.0, 16.8, 17.6, 18.4, 19.2, 20.0, 20.8, 21.6, 22.4, 23.2,
                         24.0, 24.8, 25.6, 26.4, 27.2, 28.0, 28.8, 29.6, 30.4, 31.2,
                         32.0]
    sigma_time_values: [1.5]
    sigma_space_values: [2.0]
    pulse_separation_values: [10.0]

output:
  render_animation: true
  render_snapshots: true
  archive_raw_hdf5: false
  field_record_stride: 100
  scalar_record_stride: 5
  render_downscale_factor: 2
  fringe_analysis:
    enabled: true
    fringe_window_radius: 16.0
  roi_metrics:
    enabled: true
    rois:
      - id: center_D
        shape: circle
        x0: 0.0
        y0: 0.0
        radius: "D"
      - id: fringe_window
        shape: circle
        x0: 0.0
        y0: 0.0
        radius: "2 * D"

scenarios:
  - name: square4
    geometry: square4
    potential:
      potential_type: zero
    lasers:
      - id: bl
        x0: -4.0
        y0: -4.0
        delay: 0.0
        power: "1.0P"
        pulse_separation: 10.0
        n_pulses: 9
      - id: br
        x0: 4.0
        y0: -4.0
        delay: 0.0
        power: "1.0P"
        pulse_separation: 10.0
        n_pulses: 9
      - id: tl
        x0: -4.0
        y0: 4.0
        delay: 0.0
        power: "1.0P"
        pulse_separation: 10.0
        n_pulses: 9
      - id: tr
        x0: 4.0
        y0: 4.0
        delay: 0.0
        power: "1.0P"
        pulse_separation: 10.0
        n_pulses: 9
