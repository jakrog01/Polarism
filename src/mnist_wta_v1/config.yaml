mnist:
  data_path: ~/data/mnist.npz
  n_train: 2000
  n_test: 500
  seed: 42

projection:
  method: pca
  n_components: 16

classifier:
  type: ridge
  alpha: 1.0

encoding:
  n_classes: 10
  sigma_space_um: 0.85
  sigma_time_ps: 1.5
  cutoff_sigma: 3.0
  power_definition: pulse_energy
  pulse_timing_mode: simultaneous
  min_inter_pulse_gap_ps: 0.0

amplitude:
  alpha: 0.7
  beta: 0.5
  sweep_alpha_beta:
    - [0.7, 0.5]
    - [0.6, 0.5]
    - [0.8, 0.4]

geometry:
  ring_radius_um: 12.0
  sweep_radii_um: [8.0, 10.0, 12.0, 15.0]

global:
  physics:
    hbar: 0.6582119514
    m_eff: 0.32
    gamma_C: 0.1
    gamma_R: 0.15
    gamma_I: 0.001
    g_C: 0.00024
    g_R: 0.0006
    g_I: 0.0
    R: 0.023
    kappa: 0.05
    kinetic_relaxation_eta: 1.0e-5
    init_mode: filtered_complex_gaussian
    init_k_cutoff_um: 3.0
    init_seed: 42
    init_eps: 1.0e-3
  grid:
    nx: 1024
    ny: 1024
    lx: 160.0
    ly: 160.0
    grid_type: periodic
  boundary_condition:
    absorption: cap
    profile_type: sin2
    strength: 5.0
    mask_width_percent: 0.2
  reservoir:
    reservoir_type: quadratic-double
  solver:
    method: rk4-cuda
    laplacian: isotropic-9pt
    dt: 0.01
    total_time: 150.0

readout:
  window_start_ps: 50.0
  window_end_ps: 120.0
  roi_radius_um: 2.0
  stride_steps: 100
  calibration_stride_steps: 500

calibration:
  P_single_low: 2000.0
  P_single_high: 12000.0
  n_sweep_points: 8
  n_blank_samples: 5

global_gate:
  enabled: false

slurm:
  batch_size: 25
  max_concurrent_tasks: 32
  gpu_memory_gb: 16
  time_limit: "04:00:00"
  partition: gpu
